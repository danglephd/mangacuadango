<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manga Series</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px 10px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #fff;
            font-weight: bold;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .series-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 170px;
            backdrop-filter: blur(4px);
        }

        .series-card:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: #ff6b6b;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.2);
        }

        .series-name {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-word;
        }

        .series-icon {
            font-size: 42px;
        }

        .series-url {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            word-break: break-all;
        }

        .no-series {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 24px;
            }

            .series-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }

            .series-card {
                padding: 15px;
                min-height: 140px;
            }

            .series-name {
                font-size: 15px;
            }

            .series-icon {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-title">📚 Manga Series</div>
        <div id="seriesContainer" class="series-grid"></div>
    </div>

    <script>
        // =========================
        // DANH SÁCH TRUYỆN
        // =========================

        const series = [
            {
                name: "The Fable",
                url: "https://proj-fable-series.web.app/"
            },
            // {
            //     name: "One Piece",
            //     url: "https://one-piece.web.app/"
            // },
            // {
            //     name: "Conan",
            //     url: "https://conan.web.app/"
            // }
        ];

        // =========================
        // LOAD DANH SÁCH
        // =========================

        function loadSeries() {
            const container = document.getElementById("seriesContainer");

            if (series.length === 0) {
                container.innerHTML = `
                    <div class="no-series">
                        Không có series nào
                    </div>
                `;
                return;
            }

            series.forEach(item => {

                const card = document.createElement("a");

                card.className = "series-card";
                card.href = item.url;
                card.target = "_self";
                card.title = "Mở " + item.name;

                // save local data
                card.addEventListener("click", () => {

                    let data = {};

                    const raw = localStorage.getItem("data");

                    if (raw) {
                        try {
                            data = JSON.parse(raw);
                        } catch (e) {
                            data = {};
                        }
                    }

                    if (!data[item.name]) {
                        data[item.name] = {
                            chapter: 0
                        };
                    }

                    localStorage.setItem(
                        "data",
                        JSON.stringify(data)
                    );
                });

                // icon
                const icon = document.createElement("div");
                icon.className = "series-icon";
                icon.textContent = "📖";

                // title
                const name = document.createElement("div");
                name.className = "series-name";
                name.textContent = item.name;

                // url
                const url = document.createElement("div");
                url.className = "series-url";
                url.textContent = item.url;

                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(url);

                container.appendChild(card);
            });
        }

        // =========================
        // INIT
        // =========================

        loadSeries();
    </script>

</body>

</html>
