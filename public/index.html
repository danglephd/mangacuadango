<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Series</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px 10px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #fff;
            font-weight: bold;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .series-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 150px;
        }

        .series-card:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.2);
        }

        .series-name {
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }

        .series-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .no-series {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 16px;
        }

        /* Mobile tối ưu */
        @media (max-width: 768px) {
            .page-title {
                font-size: 24px;
            }

            .series-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .series-card {
                padding: 15px;
                min-height: 120px;
            }

            .series-name {
                font-size: 14px;
            }

            .series-icon {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="page-title">📚 Manga Series</div>
        <div id="seriesContainer" class="series-grid"></div>
    </div>

    <script>
        // Danh sách series (folder names)
        const series = [
  "the-fable",
  "the-fable-bi-mat-thu-ba",
  "the-fable-the-second-contact"
];

        // Load series list
        function loadSeries() {
            const container = document.getElementById("seriesContainer");

            if (series.length === 0) {
                container.innerHTML = '<div class="no-series">Không có series nào</div>';
                return;
            }

            series.forEach(seriesName => {
                const card = document.createElement("a");
                card.className = "series-card";
                card.href = seriesName + "/index.html";
                card.title = "Mở " + seriesName;
                card.addEventListener("click", () => {
                    let data = {};

                    // load
                    const raw = localStorage.getItem("data");
                    if (raw) {
                        data = JSON.parse(raw);
                    }

                    // nếu chưa có series thì tạo mới
                    if (!data[seriesName]) {
                        data[seriesName] = {
                            chapter: 0
                        };
                    }

                    // luôn save lại
                    localStorage.setItem("data", JSON.stringify(data));
                });

                const icon = document.createElement("div");
                icon.className = "series-icon";
                icon.textContent = "📖";

                const name = document.createElement("div");
                name.className = "series-name";
                name.textContent = seriesName.replace(/-/g, " ");

                card.appendChild(icon);
                card.appendChild(name);
                container.appendChild(card);
            });
        }

        // Initialize
        loadSeries();
    </script>

</body>

</html>
