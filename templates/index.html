<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Viewer</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 10px;
        }

        .chapter-nav {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 100%;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 14px;
            display: inline-block;
            cursor: pointer;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }

        .nav-btn:disabled {
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .nav-container {
                gap: 10px;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        .chapter-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            color: #ccc;
        }

        .image-wrapper {
            margin-bottom: 10px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            background: #222;
        }

        /* Mobile tối ưu */
        @media (max-width: 768px) {
            .container {
                padding: 5px;
            }

            .chapter-title {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <nav class="chapter-nav">
        <div class="nav-container">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <select id="chapterSelect"></select>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>
    </nav>

    <div class="container">
        <div class="chapter-title" id="chapterTitle">Chapter Viewer</div>
        <div id="images"></div>
    </div>

    <script src="data.js"></script>

    <script>
        // ===== INIT =====
        let currentChapterIndex = 0;

        const seriesData = getSeriesInfo();
        const seriesPath = seriesData.path;
        const seriesName = seriesData.name;

        const chapters = Object.keys(DATA);

        // ===== LOAD LOCAL STORAGE =====
        let data = {};
        try {
            data = JSON.parse(localStorage.getItem("data")) || {};
        } catch {
            data = {};
        }

        const savedChapterIndex = data?.[seriesName]?.chapter;

        if (typeof savedChapterIndex === "number") {
            currentChapterIndex = savedChapterIndex;
        } else {
            currentChapterIndex = getCurrentChapterIndex();
        }

        // ===== INIT SELECT =====
        const select = document.getElementById("chapterSelect");
        select.innerHTML = chapters.map((chapter, index) => `
        <option value="${index}" ${index === currentChapterIndex ? "selected" : ""}>
            ${chapter}
        </option>
    `).join("");

        loadImages();
        updateNavigation();

        // ===== GET CURRENT CHAPTER FROM URL =====
        function getCurrentChapterIndex() {
            const match = window.location.pathname.match(/Chap_(\d+)/);
            if (!match) return 0;

            const chapterName = `Chap_${String(match[1]).padStart(3, '0')}`;
            const index = chapters.indexOf(chapterName);
            return index >= 0 ? index : 0;
        }

        // ===== GET SERIES INFO =====
        function getSeriesInfo() {
            const parts = window.location.pathname.split('/').filter(Boolean);

            // Ví dụ:
            // /the-fable/Chap_001/index.html
            // /the-fable/index.html

            const chapIndex = parts.findIndex(p => p.startsWith("Chap_"));

            let name;
            if (chapIndex !== -1) {
                name = parts[chapIndex - 1];
            } else {
                name = parts[parts.length - 2];
            }

            const path = "/" + parts.slice(0, parts.indexOf(name) + 1).join("/") + "/";

            return { name, path };
        }

        // ===== LOAD IMAGES =====
        function loadImages() {
            const container = document.getElementById("images");
            container.innerHTML = '';

            const currentChapter = chapters[currentChapterIndex];
            const chapterPath = `${seriesPath}${currentChapter}/`;

            const images = DATA[currentChapter] || [];

            document.getElementById("chapterTitle").textContent = currentChapter;

            images.forEach(filename => {
                const div = document.createElement("div");
                div.className = "image-wrapper";

                const img = document.createElement("img");
                img.src = chapterPath + filename;
                img.loading = "lazy";
                img.alt = filename;

                div.appendChild(img);
                container.appendChild(div);
            });
        }

        // ===== NAVIGATION =====
        function updateNavigation() {
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            prevBtn.disabled = currentChapterIndex === 0;
            nextBtn.disabled = currentChapterIndex === chapters.length - 1;

            prevBtn.textContent = currentChapterIndex > 0
                ? `← ${chapters[currentChapterIndex - 1]}`
                : "← Previous";

            nextBtn.textContent = currentChapterIndex < chapters.length - 1
                ? `${chapters[currentChapterIndex + 1]} →`
                : "Next →";
        }

        // ===== SAVE =====
        function saveCurrentChapter() {
            data[seriesName] = {
                chapter: currentChapterIndex
            };
            localStorage.setItem("data", JSON.stringify(data));
        }

        // ===== EVENTS =====
        document.getElementById("prevBtn").addEventListener("click", () => {
            if (currentChapterIndex > 0) {
                currentChapterIndex--;
                saveCurrentChapter();

                select.value = currentChapterIndex;
                loadImages();
                updateNavigation();
                window.scrollTo(0, 0);
            }
        });

        document.getElementById("nextBtn").addEventListener("click", () => {
            if (currentChapterIndex < chapters.length - 1) {
                currentChapterIndex++;
                saveCurrentChapter();

                select.value = currentChapterIndex;
                loadImages();
                updateNavigation();
                window.scrollTo(0, 0);
            }
        });

        select.addEventListener("change", () => {
            currentChapterIndex = Number(select.value);
            saveCurrentChapter();

            loadImages();
            updateNavigation();
            window.scrollTo(0, 0);
        });
    </script>

</body>

</html>
