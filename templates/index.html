<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Viewer</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 10px;
        }

        .chapter-nav {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 100%;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 14px;
            display: inline-block;
            cursor: pointer;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }

        .nav-btn:disabled {
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .nav-container {
                gap: 10px;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        .chapter-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            color: #ccc;
        }

        .image-wrapper {
            margin-bottom: 10px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            background: #222;
        }

        /* === MOBILE SWIPE FEATURE START === */
        @media (max-width: 768px) {
            .container {
                padding: 5px;
                position: relative;
                overflow: hidden;
            }

            .chapter-title {
                font-size: 16px;
            }

            /* Slider Container */
            #images {
                position: relative;
                width: 100%;
                height: 100vh;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Slider Wrapper */
            .slider-wrapper {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            /* Individual Page/Slide */
            .slide {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.3s ease, transform 0.3s ease;
            }

            .slide.active {
                opacity: 1;
                z-index: 10;
            }

            .slide.prev {
                transform: translateX(-100%);
            }

            .slide.next {
                transform: translateX(100%);
            }

            .slide img {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                object-fit: contain;
                border-radius: 0;
                background: #000;
            }

            /* Page Indicator */
            .page-indicator {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: #fff;
                padding: 8px 16px;
                border-radius: 20px;
                font-size: 14px;
                z-index: 50;
                font-weight: bold;
            }

            /* Tap zones for navigation */
            .tap-zone {
                position: fixed;
                top: 0;
                width: 20%;
                height: 100%;
                z-index: 5;
                cursor: pointer;
            }

            .tap-zone.left {
                left: 0;
            }

            .tap-zone.right {
                right: 0;
            }

            .tap-zone:active::after {
                content: '';
                position: absolute;
                inset: 0;
                background: rgba(255, 255, 255, 0.1);
            }
        }

        /* Desktop behavior unchanged */
        @media (min-width: 769px) {
            .page-indicator,
            .tap-zone {
                display: none;
            }

            #images {
                display: block !important;
            }

            .slider-wrapper {
                display: contents;
            }

            .slide {
                position: static !important;
                opacity: 1 !important;
                transform: none !important;
                height: auto !important;
                display: block !important;
            }

            .image-wrapper {
                display: block !important;
            }
        }
        /* === MOBILE SWIPE FEATURE END === */
    </style>
</head>

<body>

    <nav class="chapter-nav">
        <div class="nav-container">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <select id="chapterSelect"></select>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>
    </nav>

    <div class="container">
        <div class="chapter-title" id="chapterTitle">Chapter Viewer</div>
        <div id="images"></div>
    </div>

    <!-- === MOBILE SWIPE FEATURE START === -->
    <div id="pageIndicator" class="page-indicator"></div>
    <div id="leftTapZone" class="tap-zone left"></div>
    <div id="rightTapZone" class="tap-zone right"></div>
    <!-- === MOBILE SWIPE FEATURE END === -->

    <script src="data.js"></script>

    <script>
        // ===== INIT =====
        let currentChapterIndex = 0;
        // === MOBILE SWIPE FEATURE START ===
        let currentPageIndex = 0;
        let isMobileMode = window.innerWidth <= 768;
        let allImages = [];
        let touchStartX = 0;
        let touchEndX = 0;
        const SWIPE_THRESHOLD = 50;
        // === MOBILE SWIPE FEATURE END ===

        const seriesData = getSeriesInfo();
        const seriesPath = seriesData.path;
        const seriesName = seriesData.name;

        const chapters = Object.keys(DATA);

        // ===== LOAD LOCAL STORAGE =====
        let data = {};
        try {
            data = JSON.parse(localStorage.getItem("data")) || {};
        } catch {
            data = {};
        }

        const savedChapterIndex = data?.[seriesName]?.chapter;

        if (typeof savedChapterIndex === "number") {
            currentChapterIndex = savedChapterIndex;
        } else {
            currentChapterIndex = getCurrentChapterIndex();
        }

        // ===== INIT SELECT =====
        const select = document.getElementById("chapterSelect");
        select.innerHTML = chapters.map((chapter, index) => `
        <option value="${index}" ${index === currentChapterIndex ? "selected" : ""}>
            ${chapter}
        </option>
    `).join("");

        loadImages();
        updateNavigation();
        // === MOBILE SWIPE FEATURE START ===
        setupMobileMode();
        // === MOBILE SWIPE FEATURE END ===

        // ===== GET CURRENT CHAPTER FROM URL =====
        function getCurrentChapterIndex() {
            const match = window.location.pathname.match(/Chap_(\d+)/);
            if (!match) return 0;

            const chapterName = `Chap_${String(match[1]).padStart(3, '0')}`;
            const index = chapters.indexOf(chapterName);
            return index >= 0 ? index : 0;
        }

        // ===== GET SERIES INFO =====
        function getSeriesInfo() {
            const parts = window.location.pathname.split('/').filter(Boolean);

            // Ví dụ:
            // /the-fable/Chap_001/index.html
            // /the-fable/index.html

            const chapIndex = parts.findIndex(p => p.startsWith("Chap_"));

            let name;
            if (chapIndex !== -1) {
                name = parts[chapIndex - 1];
            } else {
                name = parts[parts.length - 2];
            }

            const path = "/" + parts.slice(0, parts.indexOf(name) + 1).join("/") + "/";

            return { name, path };
        }

        // ===== LOAD IMAGES =====
        function loadImages() {
            const container = document.getElementById("images");
            container.innerHTML = '';

            const currentChapter = chapters[currentChapterIndex];
            const chapterPath = `${seriesPath}${currentChapter}/`;

            const images = DATA[currentChapter] || [];
            
            // === MOBILE SWIPE FEATURE START ===
            allImages = images;
            currentPageIndex = 0;
            // === MOBILE SWIPE FEATURE END ===

            document.getElementById("chapterTitle").textContent = currentChapter;

            // === MOBILE SWIPE FEATURE START ===
            if (isMobileMode) {
                // Mobile: create slider structure
                const sliderWrapper = document.createElement("div");
                sliderWrapper.className = "slider-wrapper";

                images.forEach((filename, index) => {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    if (index === 0) slide.classList.add("active");

                    const img = document.createElement("img");
                    img.src = chapterPath + filename;
                    img.alt = filename;

                    slide.appendChild(img);
                    sliderWrapper.appendChild(slide);
                });

                container.appendChild(sliderWrapper);
                renderPageIndicator();
            } else {
                // Desktop: original vertical scroll layout
                images.forEach(filename => {
                    const div = document.createElement("div");
                    div.className = "image-wrapper";

                    const img = document.createElement("img");
                    img.src = chapterPath + filename;
                    img.loading = "lazy";
                    img.alt = filename;

                    div.appendChild(img);
                    container.appendChild(div);
                });
            }
            // === MOBILE SWIPE FEATURE END ===
        }

        // === MOBILE SWIPE FEATURE START ===
        function renderPage(pageIndex) {
            const slides = document.querySelectorAll(".slide");
            
            slides.forEach((slide, index) => {
                slide.classList.remove("active", "prev", "next");
                
                if (index === pageIndex) {
                    slide.classList.add("active");
                } else if (index < pageIndex) {
                    slide.classList.add("prev");
                } else {
                    slide.classList.add("next");
                }
            });

            renderPageIndicator();
        }

        function renderPageIndicator() {
            const pageIndicator = document.getElementById("pageIndicator");
            const totalPages = allImages.length;
            pageIndicator.textContent = `${currentPageIndex + 1} / ${totalPages}`;
        }

        function nextPage() {
            if (currentPageIndex < allImages.length - 1) {
                currentPageIndex++;
                renderPage(currentPageIndex);
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderPage(currentPageIndex);
            }
        }

        function setupMobileMode() {
            if (!isMobileMode) return;

            const imagesContainer = document.getElementById("images");

            // Touch events for swipe
            imagesContainer.addEventListener("touchstart", (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            imagesContainer.addEventListener("touchend", (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            // Tap zones
            document.getElementById("leftTapZone").addEventListener("click", prevPage);
            document.getElementById("rightTapZone").addEventListener("click", nextPage);
        }

        function handleSwipe() {
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > SWIPE_THRESHOLD) {
                if (diff > 0) {
                    // Swipe left → next page
                    nextPage();
                } else {
                    // Swipe right → previous page
                    prevPage();
                }
            }
        }
        // === MOBILE SWIPE FEATURE END ===

        // ===== NAVIGATION =====
        function updateNavigation() {
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            prevBtn.disabled = currentChapterIndex === 0;
            nextBtn.disabled = currentChapterIndex === chapters.length - 1;

            prevBtn.textContent = currentChapterIndex > 0
                ? `← ${chapters[currentChapterIndex - 1]}`
                : "← Previous";

            nextBtn.textContent = currentChapterIndex < chapters.length - 1
                ? `${chapters[currentChapterIndex + 1]} →`
                : "Next →";
        }

        // ===== SAVE =====
        function saveCurrentChapter() {
            data[seriesName] = {
                chapter: currentChapterIndex
            };
            localStorage.setItem("data", JSON.stringify(data));
        }

        // ===== EVENTS =====
        document.getElementById("prevBtn").addEventListener("click", () => {
            if (currentChapterIndex > 0) {
                currentChapterIndex--;
                saveCurrentChapter();

                select.value = currentChapterIndex;
                // === MOBILE SWIPE FEATURE START ===
                currentPageIndex = 0;
                // === MOBILE SWIPE FEATURE END ===
                loadImages();
                updateNavigation();
                window.scrollTo(0, 0);
            }
        });

        document.getElementById("nextBtn").addEventListener("click", () => {
            if (currentChapterIndex < chapters.length - 1) {
                currentChapterIndex++;
                saveCurrentChapter();

                select.value = currentChapterIndex;
                // === MOBILE SWIPE FEATURE START ===
                currentPageIndex = 0;
                // === MOBILE SWIPE FEATURE END ===
                loadImages();
                updateNavigation();
                window.scrollTo(0, 0);
            }
        });

        select.addEventListener("change", () => {
            currentChapterIndex = Number(select.value);
            saveCurrentChapter();

            // === MOBILE SWIPE FEATURE START ===
            currentPageIndex = 0;
            // === MOBILE SWIPE FEATURE END ===
            loadImages();
            updateNavigation();
            window.scrollTo(0, 0);
        });

        // === MOBILE SWIPE FEATURE START ===
        // Handle window resize to detect mobile mode change
        window.addEventListener("resize", () => {
            const newIsMobileMode = window.innerWidth <= 768;
            if (newIsMobileMode !== isMobileMode) {
                isMobileMode = newIsMobileMode;
                currentPageIndex = 0;
                loadImages();
                setupMobileMode();
            }
        });
        // === MOBILE SWIPE FEATURE END ===
    </script>

</body>

</html>
