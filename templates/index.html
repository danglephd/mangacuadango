<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Viewer</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 10px;
        }

        .chapter-nav {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 100%;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 14px;
            display: inline-block;
            cursor: pointer;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }

        .nav-btn:disabled {
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .nav-container {
                gap: 10px;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        .chapter-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            color: #ccc;
        }

        .image-wrapper {
            margin-bottom: 10px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            background: #222;
        }

        /* Mobile tối ưu */
        @media (max-width: 768px) {
            .container {
                padding: 5px;
            }

            .chapter-title {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <nav class="chapter-nav">
        <div class="nav-container">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <select id="chapterSelect"></select>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>
    </nav>

    <div class="container">
        <div class="chapter-title" id="chapterTitle">Chapter Viewer</div>
        <div id="images"></div>
    </div>

    <script src="data.js"></script>

    <script>
        // Danh sách chapters từ data.js
        const chapters = Object.keys(DATA);

        //load localstorage để nhớ series và chapter cuối cùng đã xem
        const savedSeries = localStorage.getItem("savedSeries");
        const savedChapterIndex = localStorage.getItem("savedChapterIndex");
        if (savedChapterIndex !== null) {
            currentChapterIndex = parseInt(savedChapterIndex);
        }

        let currentChapterIndex = 0;
        const select = document.getElementById("chapterSelect");
        const options = chapters.map((chapter, index) => {
            const selected = index === currentChapterIndex ? "selected" : "";
            return `<option value="${index}" ${selected}>${chapter}</option>`;
        }).join("");
        select.innerHTML = options;

        // Get current chapter from URL path
        function getCurrentChapterIndex() {
            const url = window.location.pathname;
            const match = url.match(/Chap_(\d+)/);
            if (match) {
                const chapterNum = parseInt(match[1]);
                const chapterName = `Chap_${String(chapterNum).padStart(3, '0')}`;
                const index = chapters.indexOf(chapterName);
                return index >= 0 ? index : 0;
            }
            return 0;
        }

        // Get series path from URL
        function getSeriesPath() {
            const url = window.location.pathname;
            const parts = url.split('/');
            // Find the part before Chap_XXX
            for (let i = parts.length - 1; i >= 0; i--) {
                if (parts[i].startsWith('Chap_')) {
                    return parts.slice(0, i).join('/') + '/';
                }
            }
            return '';
        }

        // Load images for current chapter
        function loadImages() {
            const container = document.getElementById("images");
            container.innerHTML = '';

            const seriesPath = getSeriesPath();
            const currentChapter = chapters[currentChapterIndex];
            const chapterPath = `${seriesPath}${currentChapter}/`;
            const images = DATA[currentChapter] || []; // Get images from DATA

            // Update title
            document.getElementById("chapterTitle").textContent = currentChapter;

            // Load images
            images.forEach(filename => {
                const div = document.createElement("div");
                div.className = "image-wrapper";

                const img = document.createElement("img");
                img.src = chapterPath + filename;
                img.loading = "lazy";
                img.alt = filename;

                div.appendChild(img);
                container.appendChild(div);
            });
        }

        // Update navigation buttons
        function updateNavigation() {
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            prevBtn.disabled = currentChapterIndex === 0;
            nextBtn.disabled = currentChapterIndex === chapters.length - 1;

            if (currentChapterIndex > 0) {
                prevBtn.textContent = `← ${chapters[currentChapterIndex - 1]}`;
            } else {
                prevBtn.textContent = "← Previous";
            }

            if (currentChapterIndex < chapters.length - 1) {
                nextBtn.textContent = `${chapters[currentChapterIndex + 1]} →`;
            } else {
                nextBtn.textContent = "Next →";
            }
        }

        // Initialize
        currentChapterIndex = getCurrentChapterIndex();
        loadImages();
        updateNavigation();

        // Event listeners
        document.getElementById("prevBtn").addEventListener("click", () => {
            if (currentChapterIndex > 0) {
                currentChapterIndex--;
                //update localstorage khi chuyển chapter
                localStorage.setItem("savedChapterIndex", currentChapterIndex);
                localStorage.setItem("savedSeries", window.location.pathname.split('/')[1]);
                //update select để đồng bộ với chapter hiện tại
                select.value = currentChapterIndex;
                loadImages();
                updateNavigation();
                window.scrollTo(0, 0);
            }
        });

        document.getElementById("nextBtn").addEventListener("click", () => {
            if (currentChapterIndex < chapters.length - 1) {
                currentChapterIndex++;
                //update localstorage khi chuyển chapter
                localStorage.setItem("savedChapterIndex", currentChapterIndex);
                localStorage.setItem("savedSeries", window.location.pathname.split('/')[1]);
                //update select để đồng bộ với chapter hiện tại
                select.value = currentChapterIndex;
                loadImages();
                updateNavigation();
                window.scrollTo(0, 0);
            }
        });

        select.addEventListener("change", () => {
            currentChapterIndex = Number(select.value);
            //update localstorage khi chuyển chapter
            localStorage.setItem("savedChapterIndex", currentChapterIndex);
            localStorage.setItem("savedSeries", window.location.pathname.split('/')[1]);
            loadImages();
            updateNavigation();
            window.scrollTo(0, 0);
        });
    </script>

</body>

</html>
